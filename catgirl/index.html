<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫娘桌宠</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="pet" id="pet">
      <section class="panel glass" id="panel" hidden>
        <header class="panel-bar">
          <button class="tab is-active" id="tabChat" type="button">对话</button>
          <button class="tab" id="tabSettings" type="button">设置</button>
          <button class="icon-btn" id="panelClose" type="button" title="收起">×</button>
        </header>

        <div class="view" id="chatView">
          <div class="log" id="log" role="log" aria-live="polite"></div>
          <div class="hint" id="hint" hidden></div>
          <div class="composer">
            <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
            <button class="send" id="send" type="button">发送</button>
          </div>
        </div>

        <div class="view" id="settingsView" hidden></div>
      </section>

      <div class="pet-body">
        <span class="dot" id="dot" title="llama-server 连接状态"></span>
        <div class="typing" id="typing" hidden><i></i><i></i><i></i></div>
        <img class="avatar" id="avatar" src="/assets/catgirl_character.png" alt="猫娘" data-tauri-drag-region />
      </div>

      <ul class="menu" id="menu" hidden></ul>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
