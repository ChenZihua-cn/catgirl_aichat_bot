[package]
name = "catgirl"
version = "0.1.0"
description = "桌面虚拟女友（llama-server 前端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
